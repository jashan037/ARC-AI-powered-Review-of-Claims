<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23EEF3F6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <p class="wordmark">ARC</p>

  <section id="view-upload" class="view upload">
    <div id="drop" class="drop" role="button" tabindex="0">
      <p id="drop-line" class="drop-line"></p>
      <ul id="files" class="files"></ul>
      <p id="reasons" class="reasons"></p>
    </div>
    <p id="sample" class="sample" hidden><a id="sample-link" href="#">Use sample documents</a></p>
    <input id="picker" type="file" multiple accept="application/pdf,.pdf" hidden>
  </section>

  <section id="view-chat" class="view chat" hidden>
    <div id="thread" class="thread"></div>
    <div class="bar-fade"></div>
    <form id="bar" class="bar" action="#" autocomplete="off">
      <input id="ask" class="ask" type="text" maxlength="2000" placeholder="Ask about your claim" aria-label="Ask about your claim" enterkeyhint="send">
      <button id="send" class="send" type="submit" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
      </button>
    </form>
  </section>

  <div id="overlay" class="overlay" hidden><p>Drop to add documents</p></div>

  <script src="/static/md.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ARC</title>
  <meta name="theme-color" content="#F7F7F5">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <!-- the mark: a teal arc with an amber dot at its end, next to the wordmark; it scrolls away with the page and sits on no bar -->
  <a class="logo" id="logo" href="/">
    <svg class="logo-mark" viewBox="0 0 36 26" width="36" height="26" aria-hidden="true" focusable="false">
      <path d="M3.4 22.6 A 13.6 13.6 0 0 1 26.2 9.2" fill="none" stroke="#0FA3B1" stroke-width="5.2" stroke-linecap="round"/>
      <circle cx="28.8" cy="11.6" r="3.4" fill="#F2A541"/>
    </svg>
    <span class="logo-word" id="logo-word"></span>
  </a>

  <main id="main">
    <!-- 1. landing -->
    <section id="view-landing" class="view landing" hidden>
      <div class="landing-block">
        <h1 id="landing-title" class="h1"></h1>
        <p id="landing-lead" class="lead"></p>
        <p class="landing-actions"><a id="landing-start" class="button" href="/upload"></a></p>
        <p class="landing-sample"><a id="landing-sample" class="quiet-link" href="/upload"></a></p>
        <p id="landing-note" class="note"></p>
      </div>
    </section>

    <!-- 2. upload -->
    <section id="view-upload" class="view upload" hidden>
      <div id="drop" class="drop" role="button" tabindex="0">
        <p id="drop-line" class="drop-line"></p>
        <ul id="files" class="files"></ul>
        <p id="reasons" class="reasons"></p>
      </div>
      <input id="picker" type="file" multiple accept="application/pdf,.pdf" hidden>
    </section>

    <!-- 3. chat -->
    <section id="view-chat" class="view chat" hidden>
      <div id="thread" class="thread" role="log" aria-live="polite"></div>
      <div class="bar-fade"></div>
      <form id="bar" class="bar" action="#" autocomplete="off">
        <input id="ask" class="ask" type="text" maxlength="2000" enterkeyhint="send">
        <button id="send" class="send" type="submit" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        </button>
      </form>
    </section>
  </main>

  <!-- top right on the chat view only, once the claim is ready -->
  <nav id="tools" class="tools" hidden>
    <a id="report" class="tool" href="#">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
      <span id="report-label"></span>
    </a>
    <button id="restart" class="tool" type="button">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 11a8 8 0 0 1 14-5"/><path d="M18 3v4h-4"/><path d="M20 13a8 8 0 0 1-14 5"/><path d="M6 21v-4h4"/></svg>
      <span id="restart-label"></span>
    </button>
    <span id="tool-note" class="tool-note"></span>
  </nav>

  <div id="overlay" class="overlay" hidden><p id="overlay-line"></p></div>

  <script src="/static/md.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
